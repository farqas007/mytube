<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - MyTube</title>
<link rel="icon" type="image/png" href="youtube.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-box">


<h1>
MyTube 🔴
</h1>


<h2>
Create Account
</h2>


<form id="signupForm" novalidate>



<input 
id="email"
type="email"
placeholder="Enter Email"
required
>




<input 
id="password"
type="password"
placeholder="Create Password"
required
>




<button 
id="signupBtn"
type="submit">
Create Account
</button>




<p id="msg"></p>


</form>





<p>
Already have account?

<a href="login.html">
Login
</a>

</p>




</div>





<script type="module" src="auth.js"></script>


</body>

</html>
