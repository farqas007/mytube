<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MyTube</title>

<link rel="icon" type="image/png" href="youtube.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-box">


<h1>
MyTube 🔴
</h1>


<h2>
Login
</h2>


<form id="loginForm" novalidate>



<input 
id="email"
type="email"
placeholder="Email Address"
>




<input 
id="password"
type="password"
placeholder="Password"
>




<button 
id="loginBtn"
type="submit">
Login
</button>




<p id="msg"></p>


</form>





<p>
New user?
<a href="signup.html">
Create Account
</a>
</p>




</div>





<script type="module" src="auth.js"></script>


</body>

</html>
