<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MyTube</title>

<link rel="icon" type="image/png" href="mytube-icon.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-box">


<h1>
MyTube 🔴
</h1>


<h2>
Login
</h2>


<form id="loginForm" novalidate>



<label for="email">
Email Address
</label>




<input 
id="email"
type="email"
placeholder="Email Address"
autocomplete="email"
>




<label for="password">
Password
</label>




<input 
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>




<button 
id="loginBtn"
type="submit">
Login
</button>




<p id="msg"></p>


</form>





<p>
<a href="#" id="forgotLink">
Forgot password?
</a>
</p>




<p>
New user?
<a href="signup.html">
Create Account
</a>
</p>




<div id="resetBox" style="display:none;">


<h2>
Reset Password
</h2>


<form id="resetForm" novalidate>


<label for="resetEmail">
Enter Email
</label>




<input
id="resetEmail"
type="email"
placeholder="Enter Email"
required
autocomplete="email"
>




<button
id="resetBtn"
type="submit">
Send Reset Email
</button>




<p id="resetMsg"></p>


</form>




<p>
<a href="#" id="cancelReset">
Back to Login
</a>
</p>




</div>




</div>





<script type="module" src="auth.js"></script>


</body>

</html>
