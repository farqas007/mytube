<script>

const box = document.getElementById("videoList");
const noResultsEl = document.getElementById("noResults");
const searchInput = document.getElementById("search");
const filterBar = document.getElementById("categoryFilter");


// ================= STATE =================

// currentQuery / currentTopic together define the visible set:
//   * a non-empty currentQuery  -> YouTube search results with the search filters
//   * otherwise                 -> the paginated homepage feed, optionally
//                                  narrowed to one topic by the category bar
let currentQuery = "";
let currentTopic = "All";
let trendingMode = false;


function openVideo(id){
    window.location.href = "/watch?id=" + encodeURIComponent(id);
}


// ================= RENDER =================

function buildCard(v){
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("role", "link");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", "Watch " + v.title);

    const open = () => openVideo(v.id);
    card.addEventListener("click", open);

    // Keyboard activation: Enter or Space opens the video.
    card.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            open();
        }
    });

    const thumb = document.createElement("div");
    thumb.className = "thumb";

    const img = document.createElement("img");
    img.src = v.thumb;
    img.alt = v.title;

    const badge = document.createElement("span");
    badge.textContent = v.time;

    thumb.appendChild(img);
    thumb.appendChild(badge);

    // Real anchor so crawlers can follow the title into the watch page. The
    // heading text is unchanged; only the wrapper is new, and the card's own
    // click/keyboard handlers still fire because the click bubbles up to them.
    const title = document.createElement("h3");
    const titleLink = document.createElement("a");
    titleLink.className = "card-title-link";
    titleLink.href = "/watch?id=" + encodeURIComponent(v.id);
    titleLink.textContent = v.title;
    title.appendChild(titleLink);

    const meta = document.createElement("p");
    meta.textContent = cardMeta(v);

    card.appendChild(thumb);
    card.appendChild(title);
    card.appendChild(meta);

    return card;
}


// ================= CATEGORY FILTER =================

// The homepage category bar is driven by REAL data: the backend reports which
// topics actually occur in the current feed pool (derived from each video's
// YouTube tags), and only those are rendered. Before this it always rendered a
// single dead "All" chip.
const FEED_ALL_TOPIC = "All";

// Fallback list, used only until the first feed response reports its own
// topics. Keep in sync with shared/categories.js.
let availableFeedTopics = [];
let searchFilterOptions = {
  orders: [],
  durations: [],
  uploadDates: [],
  categories: []
};

function setSearchFilterOptions(options){
  searchFilterOptions = {
    orders: (options && Array.isArray(options.orders)) ? options.orders : [],
    durations: (options && Array.isArray(options.durations)) ? options.durations : [],
    uploadDates: (options && Array.isArray(options.uploadDates)) ? options.uploadDates : [],
    categories: (options && Array.isArray(options.categories)) ? options.categories : []
  };
}

function renderCategoryFilter(){
    if(!filterBar){
        return;
    }
    const topics = [FEED_ALL_TOPIC].concat(
        availableFeedTopics.filter(t => t && t !== FEED_ALL_TOPIC)
    );

    // Rebuild only when the set actually changed, so an unrelated re-render never
    // resets focus or steals a click mid-interaction.
    const signature = topics.join("|") + "::" + currentTopic;
    if(filterBar.dataset.signature === signature){
        return;
    }
    filterBar.dataset.signature = signature;

    filterBar.replaceChildren();

    topics.forEach(topic => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-chip" + (topic === currentTopic ? " active" : "");
        btn.textContent = topic;
        btn.setAttribute("aria-pressed", topic === currentTopic ? "true" : "false");
        btn.addEventListener("click", () => {
            currentTopic = topic;
            renderCategoryFilter();
            if(currentQuery){
                // Topics only shape the home feed. With a search active the chip
                // is just a UI affordance, so nothing is re-queried — re-running
                // an identical search would burn 101 quota units for nothing.
                return;
            }
            loadHomeFeed();
        });
        filterBar.appendChild(btn);
    });
}

// ================= SEARCH FILTERS =================

// Every control here maps onto a parameter the official YouTube search.list
// resource supports, so each one changes real results rather than filtering the
// current page locally.
const searchFilters = {
    order: "relevance",
    duration: "any",
    uploadDate: "any",
    categoryId: ""
};

const searchFilterBar = document.getElementById("searchFilters");

function buildSearchFilterSelect(label, key, options, fallbackTitle){
    const wrap = document.createElement("label");
    wrap.className = "search-filter";

    const caption = document.createElement("span");
    caption.className = "search-filter-label";
    caption.textContent = label;

    const select = document.createElement("select");
    select.className = "search-filter-select";
    select.dataset.filter = key;

    const list = (options && options.length)
        ? options
        : [{ id: "any", title: fallbackTitle }];

    list.forEach(option => {
        const opt = document.createElement("option");
        opt.value = option.id;
        opt.textContent = option.title;
        select.appendChild(opt);
    });

    select.value = searchFilters[key];
    select.addEventListener("change", () => {
        searchFilters[key] = select.value;
        runSearchNow();
    });

    wrap.appendChild(caption);
    wrap.appendChild(select);

    return wrap;
}

function buildSearchFilters(){
    if(!searchFilterBar){
        return;
    }

    if(searchFilterBar.dataset.built === "1"){
        return;
    }

    searchFilterBar.dataset.built = "1";

    // "Only playable videos" — MyTube plays results in an iframe, so a video
    // that reports status.embeddable === false can never start. This asks YouTube
    // for embeddable videos up front.
    const playableLabel = document.createElement("label");
    playableLabel.className = "search-filter search-filter-toggle";

    const playableInput = document.createElement("input");
    playableInput.type = "checkbox";
    playableInput.checked = true;
    playableInput.addEventListener("change", () => {
        searchFilters.playableOnly = playableInput.checked;
        runSearchNow();
    });
    searchFilters.playableOnly = true;

    const playableText = document.createElement("span");
    playableText.textContent = "Playable only";

    playableLabel.appendChild(playableInput);
    playableLabel.appendChild(playableText);

    searchFilterBar.appendChild(
        buildSearchFilterSelect("Sort", "order", searchFilterOptions.orders, "Relevance")
    );
    searchFilterBar.appendChild(
        buildSearchFilterSelect("Length", "duration", searchFilterOptions.durations, "Any length")
    );
    searchFilterBar.appendChild(
        buildSearchFilterSelect("Uploaded", "uploadDate", searchFilterOptions.uploadDates, "Any time")
    );
    searchFilterBar.appendChild(
        buildSearchFilterSelect("Category", "categoryId", searchFilterOptions.categories, "All categories")
    );
    searchFilterBar.appendChild(playableLabel);
}

// Build the params object for one search request from the current controls.
function currentSearchFilters(){
    const params = {
        order: searchFilters.order,
        duration: searchFilters.duration,
        uploadDate: searchFilters.uploadDate,
        videoEmbeddable: searchFilters.playableOnly ? "1" : ""
    };
    if(searchFilters.categoryId && searchFilters.categoryId !== "any"){
        params.categoryId = searchFilters.categoryId;
    }
    return params;
}

function showSearchFilters(visible){
    if(searchFilterBar){
        searchFilterBar.hidden = !visible;
    }
}


// ================= SEARCH =================

function searchVideo(){
    // Voice search (voice-search.js) and the search button route through this
    // same pipeline, which renders YouTube-only results (never local videos).
    // Casing is deliberately preserved: YouTube gets the query the user typed.
    currentQuery = (searchInput ? searchInput.value : "").trim();
    runSearchNow();
}

function runSearchNow(){
    showSearchFilters(Boolean(currentQuery));
    renderMain();
}


// Lightweight debounce so typing doesn't re-render on every keystroke,
// while keeping Enter/submit immediate and reliable. 800ms of quiet typing is
// long enough that a normal search costs one API call, not one per letter.
let searchTimer = null;
function scheduleSearch(){
    if(searchTimer){
        clearTimeout(searchTimer);
    }
    searchTimer = setTimeout(searchVideo, 800);
}


if(searchInput){
    searchInput.addEventListener("input", scheduleSearch);
    searchInput.addEventListener("keydown", (e) => {
        if(e.key === "Enter"){
            e.preventDefault();
            searchVideo();
        }
    });
}


// ================= DYNAMIC DISCOVERY (Phase 7) =================
// YouTube results are requested through the backend proxy (youtube.js). If the
// backend is unreachable / the API key is missing / quota is exceeded, a
// user-facing status message is shown instead of stale/fabricated content.
// Dynamic results are marked type "youtube" and their id is "yt:<videoId>" so
// the watch page knows to use the embed.

const dynamicStatus = document.getElementById("dynamicStatus");

function ytClient(){
    // Exposed by the youtube.js module loaded at the end of this page.
    return window.MyTubeYouTube || null;
}

// Run fn immediately if the YouTube module is ready, otherwise once the
// deferred module script reports readiness. The module is loaded with
// type="module" (always deferred), so the initial render below may run
// before window.MyTubeYouTube exists — this lets us retry transparently
// instead of silently falling back to local-only results.
function whenYTReady(fn){
    if(ytClient()){
        fn();
        return;
    }
    window.addEventListener("mytube-yt-ready", fn, { once: true });
}

function showStatus(text){
    if(dynamicStatus){
        dynamicStatus.style.display = text ? "block" : "none";
        dynamicStatus.textContent = text || "";
        dynamicStatus.setAttribute("aria-busy", text ? "true" : "false");
    }
}

// Render a list of videos into the grid.
function renderVideoList(list){
    box.replaceChildren();
    list.forEach(v => {
        box.appendChild(buildCard(v));
    });
    const activeFilter = Boolean(currentQuery);
    if(noResultsEl){
        noResultsEl.style.display = (activeFilter && list.length === 0) ? "block" : "none";
    }
}

// Build the card's meta text once (works for local and youtube cards).
function cardMeta(v){
    const parts = [v.channel];
    if(v.views){
        parts.push(v.views);
    }
    if(v.topic){
        parts.push(v.topic);
    }
    return parts.join(" • ");
}

// Determine which render path to use:
//  - a query triggers a YouTube-only search (with the search filters applied);
//  - the plain homepage view renders the paginated YouTube home feed.
function renderMain(){
    if(currentQuery){
        doDynamicSearch();
        return;
    }
    loadHomeFeed();
}


// Homepage feed: the default view renders ONLY the YouTube "most popular" feed.
// Local videos are never rendered here — not as a base grid and not as an
// API-failure fallback. Failures surface a user-facing status message instead.
let homeSeq = 0;
let homeNextToken = "";
let homeVideos = [];
let homeLoadingMore = false;

// Infinite scroll: a static sentinel after the video list drives page loads.
// It lives outside #videoList so renderVideoList()'s replaceChildren() can't
// delete it, and a single IntersectionObserver (set up once in init()) reacts.
const homeScrollSentinel = document.getElementById("homeScrollSentinel");
const searchScrollSentinel = document.getElementById("searchScrollSentinel");

// True only for the homepage feed — never for a search query, which owns its own
// pagination. A topic chip is part of the home feed (the server filters the pool
// by it), so it does NOT make the home feed inactive.
function homeFeedActive(){
    return !currentQuery;
}

function homeSentinelNearBottom(){
    if(!homeScrollSentinel){
        return false;
    }
    const rect = homeScrollSentinel.getBoundingClientRect();
    const viewport = window.innerHeight || document.documentElement.clientHeight || 0;
    // 800px matches the observer's rootMargin so both paths stay in sync.
    return rect.top <= viewport + 800;
}

function maybeLoadMoreHome(){
    if(!homeFeedActive() ||
       homeLoadingMore ||
       !homeNextToken){
        return;
    }
    if(!homeSentinelNearBottom()){
        return; // user is far from the bottom — wait for the next near-bottom check
    }
    loadMoreHome();
}

// Re-check shortly after a render so short pages keep closing the gap toward a
// filled viewport without ever waiting for a real scroll event.
function scheduleHomeScrollCheck(){
    if(window.requestAnimationFrame){
        window.requestAnimationFrame(maybeLoadMoreHome);
    }
    else{
        setTimeout(maybeLoadMoreHome, 0);
    }
}

// ONE stable IntersectionObserver drives BOTH scroll sentinels (home + search).
// Both sentinels live outside #videoList, so renderVideoList()'s
// replaceChildren() can never detach them and the observer never needs to be
// recreated after a render. The guards inside each loader route the event.
function setupScrollObserver(){
    if(!window.IntersectionObserver){
        return;
    }
    const observer = new IntersectionObserver((entries) => {
        for(const entry of entries){
            if(!entry.isIntersecting){
                continue;
            }
            if(entry.target === searchScrollSentinel){
                maybeLoadMoreSearch();
            }
            else{
                maybeLoadMoreHome();
            }
        }
    }, { rootMargin: "800px 0px" });
    if(homeScrollSentinel){
        observer.observe(homeScrollSentinel);
    }
    if(searchScrollSentinel){
        observer.observe(searchScrollSentinel);
    }
}

// ONE shared, rAF-throttled scroll fallback for browsers without
// IntersectionObserver. It drives both feeds with the same near-bottom checks.
let scrollFallbackAttached = false;
function setupScrollFallback(){
    if(window.IntersectionObserver || scrollFallbackAttached){
        return;
    }
    scrollFallbackAttached = true;
    let ticking = false;
    const onScroll = () => {
        if(ticking){
            return;
        }
        ticking = true;
        const run = () => {
            ticking = false;
            maybeLoadMoreHome();
            maybeLoadMoreSearch();
        };
        if(window.requestAnimationFrame){
            window.requestAnimationFrame(run);
        }
        else{
            setTimeout(run, 0);
        }
    };
    window.addEventListener("scroll", onScroll, { passive: true });
}

async function loadMoreHome(){
    if(homeLoadingMore || !homeNextToken || !homeFeedActive()){
        return;
    }
    const client = ytClient();
    if(!client){
        return;
    }
    const seq = homeSeq;

    homeLoadingMore = true;
    showStatus("Loading more videos...");

    try{
        // The continuation cursor is opaque and already carries the seed and
        // offset, so paging never re-sends them (and can never desynchronize).
        const feed = await client.trending(12, homeNextToken);
        if(seq !== homeSeq || !homeFeedActive()){
            return;
        }

        // A failing page request (quota, rate limit, 5xx) resolves as a normal
        // object here instead of throwing. Never let it wipe the pagination
        // token — keep it alive so a later near-bottom check can retry. The
        // token is only cleared for a 400 response (invalid/expired pageToken).
        if(feed.ok === false && feed.error){
            if(feed.status === 400){
                homeNextToken = "";
                showStatus("");
            }
            else{
                showStatus("Could not load more videos. Keep scrolling to try again.");
            }
            return;
        }

        const before = homeVideos.length;
        const seen = new Set(homeVideos.map(v => v.id));
        const page = (feed.videos || []).filter(v => v && v.id && !seen.has(v.id));
        homeVideos = homeVideos.concat(page);
        homeNextToken = feed.nextPageToken || "";
        if(homeVideos.length === before){
            // The next page contained no new unique videos — stop paginating.
            homeNextToken = "";
        }
        renderVideoList(homeVideos);
        showStatus("");
        scheduleHomeScrollCheck();
    }
    catch(e){
        if(seq !== homeSeq || !homeFeedActive()){
            return;
        }
        logHome("warn", "Home load more failed:", e);
        showStatus("Could not load more videos. Keep scrolling to try again.");
    }
    finally{
        homeLoadingMore = false;
    }
}

async function loadHomeFeed(){
    const client = ytClient();
    const seq = ++homeSeq;

    // Reset pagination state; bump searchSeq so an in-flight search request
    // can't drop results onto the freshly reset home feed.
    homeNextToken = "";
    homeVideos = [];
    searchSeq++;
    // NOT cleared here on purpose. The server ships the first feed page's cards
    // inside #videoList as real /watch?id=... links, so a crawler (and a human on
    // a slow connection) sees content immediately. renderVideoList() replaces
    // these children the moment live data arrives, so leaving them up costs
    // nothing and avoids a visible content -> blank -> content flicker.

    if(!client){
        // The YouTube module is deferred (type="module"), so it may not be ready
        // yet — retry once it reports readiness.
        whenYTReady(() => {
            if(seq === homeSeq){
                loadHomeFeed();
            }
        });
        showStatus("Loading YouTube videos...");
        return;
    }

    showStatus("Loading YouTube videos...");
    try{
        // A fresh seed per page load / per topic change is what makes every
        // refresh show a different screenful of real videos. The server permutes
        // videos it has already fetched, so this costs no extra quota.
        const feed = await client.trending(12, "", {
            seed: client.newFeedSeed ? client.newFeedSeed() : String(Date.now()),
            topic: currentTopic === "All" ? "" : currentTopic
        });
        if(seq !== homeSeq){
            return;
        }
        homeVideos = (feed.videos || []).filter(v => v && v.id);
        homeNextToken = feed.nextPageToken || "";

        // The backend reports which topics actually exist in the current pool.
        // Rendering the real set keeps the category bar honest.
        if(Array.isArray(feed.topics) && feed.topics.length){
            availableFeedTopics = feed.topics;
            renderCategoryFilter();
        }

        if(!homeVideos.length){
            showStatus(feed.error
                ? ("Could not load YouTube videos: " + feed.error)
                : "No YouTube videos available right now.");
        }
        else{
            showStatus("");
        }
        renderVideoList(homeVideos);
        scheduleHomeScrollCheck();
    }
    catch(e){
        if(seq !== homeSeq){
            return;
        }
        logHome("warn", "Home feed failed:", e);
        showStatus("Could not load YouTube videos. Please try again.");
        box.replaceChildren();
        scheduleHomeScrollCheck();
    }
}


// Perform a dynamic YouTube search for the current query and render the results.
// Results are YouTube-only — local videos never appear here, even when the
// YouTube API is unreachable.
let searchSeq = 0;
let activeSearchController = null;
let searchNextToken = "";
let searchRemoteVideos = [];
let searchLoadingMore = false;

// Shortest query worth sending. search.list costs a flat 100 quota units per
// call, so a two-letter prefix would be an expensive way to learn nothing.
const SEARCH_MIN_LENGTH = 3;

// One page of search results. 50 is the API maximum and costs exactly the same
// 100 units as a 20-result page, so the biggest legal page is also the cheapest
// one per result — and fewer pages means far fewer quota units while scrolling.
const SEARCH_PAGE_SIZE = 50;

// The effective search term: the typed query. "" on the plain homepage view,
// which renders the home feed instead.
function searchTerm(){
    return currentQuery;
}

function searchSentinelNearBottom(){
    if(!searchScrollSentinel){
        return false;
    }
    const rect = searchScrollSentinel.getBoundingClientRect();
    const viewport = window.innerHeight || document.documentElement.clientHeight || 0;
    // 800px matches the observer's rootMargin so both paths stay in sync.
    return rect.top <= viewport + 800;
}

function maybeLoadMoreSearch(){
    if(!searchTerm() || searchLoadingMore || !searchNextToken){
        return;
    }
    if(!searchSentinelNearBottom()){
        return; // far from the bottom — wait for the next near-bottom check
    }
    loadMoreSearchResults();
}

// Re-check shortly after a render so short result pages keep closing the gap
// toward the viewport without waiting for a real scroll event.
function scheduleSearchScrollCheck(){
    if(window.requestAnimationFrame){
        window.requestAnimationFrame(maybeLoadMoreSearch);
    }
    else{
        setTimeout(maybeLoadMoreSearch, 0);
    }
}

// Load the next search page automatically as the sentinel approaches the
// bottom. Preserves the current query, appends (deduplicated) results, carries
// nextPageToken forward, and stays out of the way of the manual "Load more"
// button that was removed from the search results UI.
async function loadMoreSearchResults(){
    if(searchLoadingMore || !searchNextToken || !searchTerm()){
        return;
    }
    const client = ytClient();
    if(!client){
        return;
    }
    const q = searchTerm();
    const seq = searchSeq;

    searchLoadingMore = true;
    showStatus("Loading more results...");

    try{
        // Same filters as page 1, or pagination would mix two result sets.
        const result = await client.search(q, SEARCH_PAGE_SIZE, searchNextToken, undefined, currentSearchFilters());
        // Bail if the user typed something new (or changed a filter) while
        // the page was loading.
        if(seq !== searchSeq || searchTerm() !== q){
            return;
        }
        // A failing page request (quota, rate limit, 5xx) resolves as a normal
        // object here instead of throwing. Keep the token so a later near-bottom
        // check can retry; only a 400 (invalid/expired pageToken) ends search.
        if(result.ok === false && result.error){
            if(result.status === 400){
                searchNextToken = "";
                showStatus("");
            }
            else{
                showStatus("Could not load more results. Keep scrolling to try again.");
            }
            return;
        }
        const page = result.videos || [];
        const before = searchRemoteVideos.length;
        const seen = new Set(searchRemoteVideos.map(v => v.id));
        searchRemoteVideos = searchRemoteVideos.concat(
            page.filter(v => v && v.id && !seen.has(v.id))
        );
        searchNextToken = result.nextPageToken || "";
        if(searchRemoteVideos.length === before){
            // This page added no new unique videos — stop paginating.
            searchNextToken = "";
        }
        renderVideoList(searchRemoteVideos);
        showStatus("");
        scheduleSearchScrollCheck();
    }
    catch(e){
        logHome("warn", "Load more failed:", e);
        showStatus("Could not load more results. Keep scrolling to try again.");
    }
    finally{
        searchLoadingMore = false;
    }
}

async function doDynamicSearch(){
    const client = ytClient();
    const term = searchTerm();
    const seq = ++searchSeq;

    // Leaving the home feed: invalidate any in-flight home page request so it
    // can't append old home videos onto the new search results.
    homeSeq++;
    homeNextToken = "";

    // Reset pagination state for this search.
    searchNextToken = "";
    searchRemoteVideos = [];

    // Cancel any in-flight YouTube API request from a previous keystroke/chip.
    if(activeSearchController){
        activeSearchController.abort();
        activeSearchController = null;
    }

    if(!client){
        // Deferred module not loaded yet. Retry once it reports readiness —
        // do NOT render local videos meanwhile.
        whenYTReady(() => {
            if(seq === searchSeq && searchTerm() === term){
                doDynamicSearch();
            }
        });
        showStatus("Searching YouTube...");
        return;
    }

    // Require at least SEARCH_MIN_LENGTH characters before hitting the YouTube
    // API: every search call costs 100 quota units.
    if(term.length < SEARCH_MIN_LENGTH){
        box.replaceChildren();
        showStatus("Type at least " + SEARCH_MIN_LENGTH + " characters to search YouTube.");
        searchNextToken = "";
        return;
    }

    const controller = new AbortController();
    activeSearchController = controller;

    showStatus("Searching YouTube...");
    let remote = [];
    let apiError = "";
    try{
        const result = await client.search(term, SEARCH_PAGE_SIZE, "", controller.signal, currentSearchFilters());
        remote = result.videos || [];
        searchNextToken = result.nextPageToken || "";
        apiError = result.error || "";
    }
    catch(e){
        if(e && e.name === "AbortError"){
            return; // superseded by a newer search — do not render
        }
        apiError = "Search failed.";
        logHome("warn", "Dynamic search failed:", e);
    }

    if(seq !== searchSeq){
        return; // a newer search superseded this one
    }

    searchRemoteVideos = remote;
    if(!searchRemoteVideos.length){
        searchNextToken = "";
        showStatus(apiError
            ? ("Could not search YouTube: " + apiError)
            : "No YouTube videos found for this search.");
    }
    else{
        showStatus("");
    }
    renderVideoList(searchRemoteVideos);
    scheduleSearchScrollCheck();
}

function logHome(level, msg, err){
    if(window.console && typeof window.console[level] === "function"){
        window.console[level](msg, err || "");
    }
}


// Restore ?q= from the URL on load (watch page search uses index.html?q=...).
// Casing is preserved: YouTube receives the query exactly as it was typed.
(function initSearchFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const q = (params.get("q") || "").trim();
    currentQuery = q;
    if(searchInput){
        searchInput.value = q;
    }
})();


// ================= SIDEBAR =================

// Make a sidebar item keyboard accessible (Enter/Space activate).
function makeSideItemInteractive(el, onClick){
    if(!el){
        return;
    }
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.addEventListener("click", onClick);
    el.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            onClick();
        }
    });
}


function clearSidebarActive(){
    ["sideHome", "sideTrending", "sideSubs", "sideLibrary"].forEach(id => {
        const el = document.getElementById(id);
        if(el){
            el.classList.remove("active");
            el.setAttribute("aria-current", "false");
        }
    });
}


function setSidebarActive(id){
    clearSidebarActive();
    const el = document.getElementById(id);
    if(el){
        el.classList.add("active");
        el.setAttribute("aria-current", "true");
    }
}


function showSidebarMsg(text){
    let msgBox = document.getElementById("sidebarMsg");
    if(!msgBox){
        msgBox = document.createElement("div");
        msgBox.id = "sidebarMsg";
        msgBox.textContent = "";
        document.body.appendChild(msgBox);
    }
    msgBox.textContent = text;
    setTimeout(() => {
        msgBox.textContent = "";
    }, 2500);
}


const sideHome = document.getElementById("sideHome");
const sideTrending = document.getElementById("sideTrending");
const sideSubs = document.getElementById("sideSubs");
const sideLibrary = document.getElementById("sideLibrary");
const sideHistory = document.getElementById("sideHistory");
const sideWatchLater = document.getElementById("sideWatchLater");
const sideLikedVideos = document.getElementById("sideLikedVideos");


makeSideItemInteractive(sideHome, () => {
    window.location.href = "index.html";
});


makeSideItemInteractive(sideTrending, () => {
    trendingMode = !trendingMode;
    currentTopic = "All";
    currentQuery = "";
    if(searchInput){ searchInput.value = ""; }
    searchSeq++;
    renderCategoryFilter();
    setSidebarActive(trendingMode ? "sideTrending" : "sideHome");
    // Both directions simply re-roll the feed; the toggle only moves the
    // sidebar highlight. The previous `_t` cache-buster did nothing at all,
    // because the upstream cache key never included it.
    loadHomeFeed();
});


makeSideItemInteractive(sideSubs, () => {
    window.location.href = "subscriptions.html";
});


makeSideItemInteractive(sideLibrary, () => {
    window.location.href = "library.html";
});


// "You" section: deep-link straight into the matching library tab.
makeSideItemInteractive(sideHistory, () => {
    window.location.href = "library.html?tab=history";
});

makeSideItemInteractive(sideWatchLater, () => {
    window.location.href = "library.html?tab=saved";
});

makeSideItemInteractive(sideLikedVideos, () => {
    window.location.href = "library.html?tab=liked";
});


// ================= INIT =================

(function init(){
    // Start with the "All" chip; the real topic list arrives with the first feed
    // response and replaces it via renderCategoryFilter().
    renderCategoryFilter();
    setSidebarActive("sideHome");
    setupScrollObserver();
    setupScrollFallback();
    showSearchFilters(Boolean(currentQuery));
    renderMain();
    // The filter controls need the option catalogues from the YouTube module,
    // which is deferred, so build them as soon as it reports readiness.
    whenYTReady(() => {
        applySearchFilterCatalogues();
        buildSearchFilters();
    });
})();


// Pull the static option catalogues (sort / length / uploaded / categories) out
// of the YouTube module. They are constant reference data, so building the
// controls once is enough.
function applySearchFilterCatalogues(){
    const client = ytClient();
    if(!client){
        return;
    }
    setSearchFilterOptions({
        orders: client.SEARCH_ORDER_OPTIONS,
        durations: client.SEARCH_DURATION_OPTIONS,
        uploadDates: client.SEARCH_UPLOAD_DATE_OPTIONS,
        categories: [{ id: "any", title: "All categories" }].concat(
            Array.isArray(client.VIDEO_CATEGORIES) ? client.VIDEO_CATEGORIES : []
        )
    });
}

<script type="module">
import {
  search,
  trending,
  newFeedSeed,
  FEED_TOPICS,
  VIDEO_CATEGORIES,
  SEARCH_ORDER_OPTIONS,
  SEARCH_DURATION_OPTIONS,
  SEARCH_UPLOAD_DATE_OPTIONS
} from "./youtube.js";
// Expose the client on window so the inline homepage script can call it.
window.MyTubeYouTube = {
  search: search,
  trending: trending,
  newFeedSeed: newFeedSeed,
  FEED_TOPICS: FEED_TOPICS,

  SEARCH_DURATION_OPTIONS: SEARCH_DURATION_OPTIONS,
  SEARCH_UPLOAD_DATE_OPTIONS: SEARCH_UPLOAD_DATE_OPTIONS
};
// Signal readiness. This module is deferred, so the inline homepage script may
// have already run its initial render before this executes; it listens for this
// event to retry dynamic loading (search + home discovery) with the client set.
window.dispatchEvent(new Event("mytube-yt-ready"));
</script>


<!-- MyTube sidebar subscriptions -->
<script type="module">
import { getSubscriptions } from "./data.js";
import { auth } from "./firebase.js";

const sidebarList = document.getElementById("sidebarSubscriptionsList");
const showMoreBtn = document.getElementById("sidebarShowMore");

let sidebarSubscriptions = [];
let sidebarExpanded = false;

function getSubscriptionTime(item){
    const value = item?.subscribedAt;

    if(value && typeof value.toMillis === "function"){
        return value.toMillis();
    }

    if(value?.seconds){
        return Number(value.seconds) * 1000;
    }

    const time = Date.parse(value || "");
    return Number.isFinite(time) ? time : 0;
}

function clearSidebarSubscriptions(){
    sidebarSubscriptions = [];
    sidebarExpanded = false;

    if(sidebarList){
        sidebarList.replaceChildren();
    }

    if(showMoreBtn){
        showMoreBtn.hidden = true;
    }
}

function createSubscriptionRow(subscription){
    const button = document.createElement("button");
    button.type = "button";
    button.className = "sidebar-subscription";

    const avatar = document.createElement("img");
    avatar.className = "sidebar-subscription-avatar";
    avatar.alt = "";
    avatar.loading = "lazy";

    const name = String(
        subscription.channelName ||
        subscription.id ||
        "Channel"
    );

    if(subscription.channelThumb){
        avatar.src = subscription.channelThumb;
        avatar.onerror = () => {
            avatar.removeAttribute("src");
        };
    }

    const label = document.createElement("span");
    label.className = "sidebar-subscription-name";
    label.textContent = name;

    button.append(avatar, label);

    button.addEventListener("click", () => {
        window.location.href = "subscriptions.html";
    });

    return button;
}

function renderSidebarSubscriptions(){
    if(!sidebarList || !showMoreBtn){
        return;
    }

    sidebarList.replaceChildren();

    const visible = sidebarExpanded
        ? sidebarSubscriptions
        : sidebarSubscriptions.slice(0, 7);

    visible.forEach(subscription => {
        sidebarList.appendChild(createSubscriptionRow(subscription));
    });

    showMoreBtn.hidden = sidebarSubscriptions.length <= 7;

    const icon = showMoreBtn.querySelector(".sidebar-show-more-icon");
    const text = showMoreBtn.querySelector("span:last-child");

    if(icon){
        icon.textContent = sidebarExpanded ? "⌃" : "⌄";
    }

    if(text){
        text.textContent = sidebarExpanded ? "Show less" : "Show more";
    }
}

async function loadSidebarSubscriptions(user){
    if(!user){
        clearSidebarSubscriptions();
        return;
    }

    try{
        const subscriptions = await getSubscriptions(user.uid);

        sidebarSubscriptions = Array.isArray(subscriptions)
            ? subscriptions.slice().sort(
                (a, b) => getSubscriptionTime(b) - getSubscriptionTime(a)
            )
            : [];

        renderSidebarSubscriptions();
    }
    catch(error){
        console.warn(
            "Could not load sidebar subscriptions:",
            error
        );
        clearSidebarSubscriptions();
    }
}

if(showMoreBtn){
    showMoreBtn.addEventListener("click", () => {
        sidebarExpanded = !sidebarExpanded;
        renderSidebarSubscriptions();
    });
}

window.addEventListener("mytube-auth-change", () => {
    loadSidebarSubscriptions(auth.currentUser);
});

loadSidebarSubscriptions(auth.currentUser);
</script>
